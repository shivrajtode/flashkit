</text><text x="28" y="170" font-size="21" fill="#A5B6CE" font-family="'Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif">the recovery's own install log.</text></g><g transform="translate(442 24)"><rect width="394" height="220" rx="24" fill="#101827" stroke="#4F9BFF" stroke-opacity=".35" stroke-width="1.5"/><g transform="translate(26 36)"><rect width="64" height="64" rx="18" fill="url(#c1)"/><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="21" y="21" width="22" height="22" rx="4"/><path d="M27 14 v7 M37 14 v7 M27 43 v7 M37 43 v7 M14 27 h7 M14 37 h7 M43 27 h7 M43 37 h7"/></g></g><text x="106" y="76" font-size="25" font-weight="700" fill="#F2F6FC" font-family="'Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif">Flash images</text><text x="28" y="140" font-size="21" fill="#A5B6CE" font-family="'Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif">boot, recovery, vbmeta, dtbo...</text><text x="28" y="170" font-size="21" fill="#A5B6CE" font-family="'Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif">with type-to-confirm safety.</text></g><g transform="translate(860 24)"><rect width="394" height="220" rx="24" fill="#101827" stroke="#9B6BFF" stroke-opacity=".35" stroke-width="1.5"/><g transform="translate(26 36)"><rect width="64" height="64" rx="18" fill="url(#c2)"/><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 49 H27 V39 H39 V29 H51 V15"/><path d="M45 21 L51 15 L57 21"/></g></g><text x="106" y="76" font-size="25" font-weight="700" fill="#F2F6FC" font-family="'Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif">GSI in 3 stages</text><text x="28" y="140" font-size="21" fill="#A5B6CE" font-family="'Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif">Clean or dirty flash, step by step,</text><text x="28" y="170" font-size="21" fill="#A5B6CE" font-family="'Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif">with a real Cancel button.</text></g><g transform="trans